---
# Cassandra — NOT INSTRUMENTED.
# No New Relic or OpenTelemetry annotations/env-vars present.
# This appears in discovery output with instrumented=false.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassandra
  namespace: demo-services
  labels:
    app: cassandra
    service-type: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
        service-type: database
    spec:
      containers:
        - name: cassandra
          image: cassandra:5.0
          ports:
            - name: intra-node
              containerPort: 7000
            - name: tls-intra-node
              containerPort: 7001
            - name: jmx
              containerPort: 7199
            - name: cql
              containerPort: 9042
          env:
            - name: CASSANDRA_CLUSTER_NAME
              value: "demo-cluster"
            - name: CASSANDRA_DC
              value: "datacenter1"
            - name: CASSANDRA_RACK
              value: "rack1"
            - name: MAX_HEAP_SIZE
              value: "256M"
            - name: HEAP_NEWSIZE
              value: "128M"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: demo-services
  labels:
    app: cassandra
    service-type: database
spec:
  selector:
    app: cassandra
  ports:
    - name: cql
      port: 9042
      targetPort: 9042
      protocol: TCP
    - name: jmx
      port: 7199
      targetPort: 7199
      protocol: TCP
  type: ClusterIP
