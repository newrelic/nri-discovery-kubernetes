---
# Kafka — INSTRUMENTED via New Relic on-host integration annotation.
# The nri-kafka annotation triggers the NR infrastructure agent to scrape Kafka JMX metrics.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: demo-services
  labels:
    app: kafka
    service-type: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        service-type: messaging
      annotations:
        newrelic.com/integrations-config: |
          [{"name":"nri-kafka","interval":"15s","labels":{"env":"demo"},"timeout":300,"config":{"cluster_name":"demo-kafka","autodiscover_strategy":"zookeeper"}}]
    spec:
      containers:
        - name: kafka
          image: apache/kafka:latest
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: demo-services
  labels:
    app: kafka
    service-type: messaging
  annotations:
    newrelic.com/integrations-config: |
      [{"name":"nri-kafka","interval":"15s","labels":{"env":"demo"},"timeout":300}]
    prometheus.io/scrape: "false"
spec:
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
      protocol: TCP
  type: ClusterIP
