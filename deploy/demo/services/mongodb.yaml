---
# MongoDB — NOT INSTRUMENTED.
# No New Relic or OpenTelemetry annotations/env-vars present.
# This appears in discovery output with instrumented=false.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: demo-services
  labels:
    app: mongodb
    service-type: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        service-type: database
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "admin"
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: "demopassword"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: demo-services
  labels:
    app: mongodb
    service-type: database
spec:
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
      protocol: TCP
  type: ClusterIP
