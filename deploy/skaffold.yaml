---
apiVersion: skaffold/v1beta11
kind: Config
build:
  tagPolicy:
    sha256: {}
  artifacts:
    - image: newrelic/nri-discovery-kubernetes
      context: .
      docker:
        dockerfile: Dockerfile
  local:
    push: false
deploy:
  kubectl:
    manifests:
      - deploy/minikube.yaml


profiles:
  - name: gcp
    build:
      tagPolicy:
        sha256: {}
      artifacts:
        - image: us-west2-docker.pkg.dev/k8s-o11y-team/newrelic/nri-discovery-kubernetes
          context: .
          docker:
            dockerfile: Dockerfile
      googleCloudBuild:
        projectId: k8s-o11y-team
    deploy:
      kubectl:
        manifests:
          - deploy/gcp.yaml
